<div class="space-y-4" id="file-upload-wrapper">

    <div class="file-item flex items-center gap-3">
        <input
            type="file"
            class="file-input block w-full text-sm
                   text-slate-700 dark:text-slate-200
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-lg file:border-0
                   file:text-sm file:font-semibold
                   file:bg-slate-100 file:text-slate-700
                   dark:file:bg-slate-700 dark:file:text-slate-200
                   bg-white dark:bg-slate-800
                   border border-slate-300 dark:border-slate-600
                   rounded-lg"
        />

        <button
            type="button"
            class="remove-btn hidden px-3 py-2 text-sm rounded-lg
                   bg-red-500 text-white hover:bg-red-600">
            حذف
        </button>
    </div>

    <button
        type="button"
        id="add-file-btn"
        class="px-4 py-2 text-sm rounded-lg
               bg-slate-600 text-white hover:bg-slate-700
               dark:bg-slate-700 dark:hover:bg-slate-600">
        افزودن فایل جدید
    </button>

</div>

<script>
    document.getElementById('add-file-btn').addEventListener('click', function () {
        const wrapper = document.getElementById('file-upload-wrapper');
        const item = wrapper.querySelector('.file-item').cloneNode(true);

        item.querySelector('.file-input').value = '';
        item.querySelector('.remove-btn').classList.add('hidden');
        item.removeAttribute('data-file-id');

        wrapper.insertBefore(item, this);
    });

    document.addEventListener('change', function (e) {
        if (!e.target.classList.contains('file-input')) return;

        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 10 * 1024 * 1024) {
            alert('حجم فایل نباید بیشتر از ۱۰ مگابایت باشد');
            e.target.value = '';
            return;
        }

        const formData = new FormData();
        formData.append('file', file);

        fetch('/upload-file', {
            method: 'POST',
            body: formData
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const item = e.target.closest('.file-item');
                    item.dataset.fileId = data.file_id;
                    item.querySelector('.remove-btn').classList.remove('hidden');
                } else {
                    alert('خطا در آپلود فایل');
                    e.target.value = '';
                }
            });
    });

    document.addEventListener('click', function (e) {
        if (!e.target.classList.contains('remove-btn')) return;

        const item = e.target.closest('.file-item');
        const fileId = item.dataset.fileId;

        fetch('/remove-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_id: fileId })
        })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    item.remove();
                } else {
                    alert('خطا در حذف فایل');
                }
            });
    });
</script>
